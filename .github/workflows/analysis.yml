name: Analysis

on: [push]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      uses: php-actions/composer@v6
      with:
        version: 1
        php_version: 8.2

    - name: PHPStan Static Analysis
      uses: php-actions/phpstan@v3
      with:
        path: php/
        php_version: 8.2
        level: 2
